version: "3.6"

services:
  apache_base:
    build:
      context: ./services/dummy
    image: apache_base:latest
    container_name: apache_base
    ports:
      - "80:80"
    networks:
      - bridge_network
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_TO_FILE: ${LOG_TO_FILE}
      LOG_DIR: ${LOG_DIR}

      SERVICE_NAME: apache_base

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  service_bridge:
    build: ./services/service-bridge
    image: service_bridge
    container_name: service_bridge
    depends_on:
      - apache_base
    ports:
      - "5002:5002"
    networks:
      - bridge_network
    environment:
      SERVICE_NAME: service-bridge
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_TO_FILE: ${LOG_TO_FILE}
      LOG_DIR: ${LOG_DIR}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      REDIS_RATE_LIMIT: ${REDIS_RATE_LIMIT}
      REDIS_RATE_WINDOW: ${REDIS_RATE_WINDOW}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}
      MAX_RETRIES: ${MAX_RETRIES}

      BRIDGE_CONFIG: ${BRIDGE_CONFIG}

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - bridge_network

  kafka:
    image: confluentinc/cp-kafka:7.9.9
    container_name: kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: >-
        PLAINTEXT://kafka:29092, CONTROLLER://kafka:29093, PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092, PLAINTEXT_HOST://YOUR_WINDOWS_SERVER_IP:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT, PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    networks:
      - bridge_network

  identity:
    build: ./services/identity
    image: identity
    container_name: identity
    depends_on:
      - apache_base
    ports:
      - "5001:5001"
    networks:
      - bridge_network
    environment:
      SERVICE_NAME: identity

      LOG_LEVEL: ${LOG_LEVEL}
      LOG_TO_FILE: ${LOG_TO_FILE}
      LOG_DIR: ${LOG_DIR}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES}


  project:
    build: ./services/project
    image: project
    container_name: project
    depends_on:
      - apache_base
    ports:
      - "5003:5003"
    networks:
      - bridge_network
    environment:
      SERVICE_NAME: project

      LOG_LEVEL: ${LOG_LEVEL}
      LOG_TO_FILE: ${LOG_TO_FILE}
      LOG_DIR: ${LOG_DIR}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}


networks:
  bridge_network:
    driver: bridge
